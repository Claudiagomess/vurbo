<section class="wrap narrow panel">
  <p class="kicker">Entrar</p>
  <h2>A tua área</h2>
  @if (error) { <p class="error">{{ error }}</p> }
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label><span>Email</span><input type="email" formControlName="email" autocomplete="username" /></label>
    <label><span>Palavra-passe</span><input type="password" formControlName="password" autocomplete="current-password" /></label>
    <button class="btn" type="submit" [disabled]="sending">{{ sending ? 'A entrar…' : 'Entrar' }}</button>
  </form>
  <p class="meta">Ainda sem conta? <a routerLink="/registo">Criar conta</a></p>
</section>
